<style>
  .cart-container {
    max-width: 1200px;
    margin: 40px auto 80px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 40px;
  }
  .cart-section-title {
    font-size: 1.5rem;
    color: var(--navy);
    margin-bottom: 24px;
    font-weight: 800;
  }
  .cart-card {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    padding: 32px;
  }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid #e2e8f0;
  }
  .cart-item:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .cart-item-info {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .cart-item-img {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    background: #f1f5f9;
  }
  .cart-item-title {
    font-weight: 700;
    color: var(--navy);
    font-size: 1.05rem;
    margin-bottom: 4px;
  }
  .cart-item-author {
    font-size: 0.85rem;
    color: var(--gray400);
  }
  .cart-item-price {
    font-weight: 800;
    color: var(--brand);
    font-size: 1.1rem;
    text-align: right;
  }
  .cart-remove-btn {
    color: var(--red);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0;
    margin-top: 8px;
  }
  .cart-remove-btn:hover {
    text-decoration: underline;
  }
  .checkout-form .form-group {
    margin-bottom: 20px;
  }
  .checkout-form label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--navy);
    font-size: 0.9rem;
  }
  .checkout-form input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  .checkout-form input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(247, 148, 29, 0.2);
  }
  .payment-method {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .payment-method:hover {
    border-color: var(--brand);
  }
  .payment-method input[type="radio"] {
    width: auto;
    accent-color: var(--brand);
  }
  .payment-method-name {
    font-weight: 600;
    color: var(--navy);
  }
  .cart-summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 1rem;
  }
  .cart-total-row {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed #cbd5e1;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--navy);
  }
  .btn-checkout {
    width: 100%;
    padding: 16px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 1.1rem;
    cursor: pointer;
    margin-top: 24px;
    transition: background 0.3s;
  }
  .btn-checkout:hover {
    background: #d83b18;
  }
  .empty-cart {
    text-align: center;
    padding: 60px 20px;
  }
  
  @media(max-width: 992px) {
    .cart-container {
      grid-template-columns: 1fr;
    }
  }
  @media(max-width: 576px) {
    .cart-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .cart-item-price {
      text-align: left;
      align-self: flex-start;
    }
    .cart-card {
      padding: 20px;
    }
  }
</style>
</head>

<div style="background: #f8fafc; padding: 40px 0 100px;">
  <div class="container">
    <h1 class="cart-section-title">Thanh toán khóa học</h1>
    
    <div class="cart-container" id="cart-page-content">
      <!-- Mặc định ẩn, sẽ được JS render -->
    </div>
  </div>
</div>

<script>
  function renderCartPage() {
    const container = document.getElementById('cart-page-content');
    const items = JSON.parse(localStorage.getItem('cartItems')) || [];
    
    if (items.length === 0) {
      container.style.gridTemplateColumns = '1fr';
      container.innerHTML = `
        <div class="cart-card empty-cart">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" style="margin-bottom:20px;">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <h2 style="color:var(--navy); margin-bottom:12px;">Giỏ hàng của bạn đang trống</h2>
          <p style="color:var(--gray400); margin-bottom:24px;">Hãy chọn cho mình một khóa học phù hợp để bắt đầu hành trình nhé.</p>
          <a href="courses.html" style="display:inline-block; padding:12px 24px; background:var(--brand); color:#fff; font-weight:700; border-radius:8px; text-decoration:none;">Khám phá khóa học</a>
        </div>
      `;
      return;
    }

    const total = items.reduce((sum, it) => sum + it.price, 0);

    const itemsHTML = items.map((it, idx) => `
      <div class="cart-item">
        <div class="cart-item-info">
          ${it.img ? `<img src="${it.img}" alt="${it.name}" class="cart-item-img" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;">` : `<div style="width: 80px; height: 80px; background: var(--navy); border-radius: 8px; display:flex; align-items:center; justify-content:center; color:white; font-size:24px; font-weight:800;">M</div>`}
          <div>
            <div class="cart-item-title">${it.name}</div>
            <div class="cart-item-author">Truy cập trọn đời</div>
            <button class="cart-remove-btn" onclick="removeCartItemPage(${idx})">Xóa</button>
          </div>
        </div>
        <div class="cart-item-price">${it.price.toLocaleString('vi-VN')}đ</div>
      </div>
    `).join('');

    container.innerHTML = `
      <!-- Left: Order Items -->
      <div>
        <div class="cart-card">
          <h2 style="font-size: 1.1rem; color: var(--navy); margin-bottom: 24px; font-weight: 700;">Đơn hàng của bạn (${items.length} khóa học)</h2>
          ${itemsHTML}
        </div>
      </div>
      
      <!-- Right: Checkout Form -->
      <div>
        <div class="cart-card checkout-form">
          <h2 style="font-size: 1.1rem; color: var(--navy); margin-bottom: 24px; font-weight: 700;">Thông tin thanh toán</h2>
          
          <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" placeholder="Nhập họ và tên đầy đủ" required>
          </div>
          <div class="form-group">
            <label>Email (Để nhận mã kích hoạt)</label>
            <input type="email" placeholder="example@gmail.com" required>
          </div>
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="tel" placeholder="Nhập số điện thoại" required>
          </div>

          <h2 style="font-size: 1.1rem; color: var(--navy); margin: 24px 0 16px; font-weight: 700;">Phương thức thanh toán</h2>
          <label class="payment-method">
            <input type="radio" name="payment" value="bank" checked>
            <div class="payment-method-name">Chuyển khoản ngân hàng (VietQR)</div>
          </label>
          <label class="payment-method">
            <input type="radio" name="payment" value="momo">
            <div class="payment-method-name">Ví điện tử MoMo</div>
          </label>
          <label class="payment-method">
            <input type="radio" name="payment" value="card">
            <div class="payment-method-name">Thẻ Visa / Mastercard</div>
          </label>

          <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid #e2e8f0;">
            <div class="cart-summary-row">
              <span style="color:var(--gray400);">Tạm tính:</span>
              <span style="font-weight:600;">${total.toLocaleString('vi-VN')}đ</span>
            </div>
            <div class="cart-summary-row">
              <span style="color:var(--gray400);">Khuyến mãi:</span>
              <span style="font-weight:600; color:var(--brand);">-0đ</span>
            </div>
            <div class="cart-total-row">
              <span>Tổng thanh toán</span>
              <span style="color:var(--brand);">${total.toLocaleString('vi-VN')}đ</span>
            </div>
          </div>

          <button class="btn-checkout" onclick="processCheckout()">Hoàn tất thanh toán</button>
          <p style="font-size: 0.8rem; color: var(--gray400); text-align: center; margin-top: 16px;">Bằng việc nhấp vào nút "Hoàn tất", bạn đồng ý với Điều khoản dịch vụ của chúng tôi.</p>
        </div>
      </div>
    `;
  }

  window.processCheckout = function() {
    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
    if (!isLoggedIn) {
      alert("Vui lòng đăng nhập hoặc đăng ký để thanh toán!");
      window.location.href = "login.html";
      return;
    }
    
    const items = JSON.parse(localStorage.getItem('cartItems')) || [];
    if (items.length === 0) return;
    
    let purchased = JSON.parse(localStorage.getItem('purchasedCourses')) || [];
    purchased = purchased.concat(items);
    localStorage.setItem('purchasedCourses', JSON.stringify(purchased));
    
    // Create billing history entry
    let billing = JSON.parse(localStorage.getItem('billingHistory')) || [];
    const orderId = '#ORD-' + Math.floor(Math.random() * 900 + 100);
    const dateStr = new Date().toLocaleDateString('vi-VN');
    const total = items.reduce((sum, it) => sum + it.price, 0);
    
    // Group item names
    const courseNames = items.map(it => it.name).join(', ');
    
    billing.unshift({
      date: dateStr,
      orderId: orderId,
      course: courseNames,
      price: total
    });
    localStorage.setItem('billingHistory', JSON.stringify(billing));
    
    // Clear cart
    localStorage.removeItem('cartItems');
    
    alert("Thanh toán thành công! Khóa học đã được thêm vào tài khoản của bạn.");
    window.location.href = "my-courses.html";
  }

  function removeCartItemPage(idx) {
    let items = JSON.parse(localStorage.getItem('cartItems')) || [];
    items.splice(idx, 1);
    localStorage.setItem('cartItems', JSON.stringify(items));
    renderCartPage();
    // Update badge globally
    document.querySelectorAll('.nav-cart-badge').forEach(b => b.textContent = items.length);
  }

  document.addEventListener('DOMContentLoaded', renderCartPage);
</script>

<script src="main.js" defer></script>
</body>
