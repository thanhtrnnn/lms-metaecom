<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang học - META ECOM UNI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0726;
    --sidebar-bg: rgba(0,0,0,0.3);
    --border: rgba(255,255,255,0.1);
    --brand: #ef4b28;
    --gray-text: #94a3b8;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', sans-serif; background: var(--bg); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  /* Header */
  header {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    justify-content: space-between;
    flex-shrink: 0;
  }
  .btn-back {
    color: var(--gray-text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 0.9rem;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .btn-back:hover { color: #fff; }
  .btn-buy {
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 0.85rem;
    display: none; /* Shown in preview mode */
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  
  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }
  
  /* Left Area */
  .main-area { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  
  .video-container {
    width: 100%;
    background: #000;
    aspect-ratio: 16/9;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .lesson-info { padding: 32px 40px; max-width: 1000px; margin: 0 auto; width: 100%; }
  
  .lesson-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 0.85rem; }
  .badge-gray { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; color: #fff; }
  .badge-green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); padding: 4px 8px; border-radius: 4px; font-weight: 600; }
  .meta-time { color: var(--gray-text); display: flex; align-items: center; gap: 4px; }
  
  .lesson-title { font-size: 2rem; font-weight: 800; margin-bottom: 24px; text-transform: uppercase; }
  
  .tabs { display: flex; gap: 8px; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 8px; margin-bottom: 24px; }
  .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 0.9rem; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .tab-btn.active { background: #fff; color: var(--bg); }
  .tab-btn:not(.active) { color: var(--gray-text); }
  .tab-btn:not(.active):hover { color: #fff; background: rgba(255,255,255,0.1); }
  
  .tab-content { color: var(--gray-text); font-size: 0.95rem; line-height: 1.6; min-height: 100px; }
  
  .next-btn {
    display: flex; align-items: center; justify-content: flex-end; gap: 16px;
    margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);
    cursor: pointer; text-align: right;
  }
  .next-btn:hover .next-icon { background: rgba(255,255,255,0.2); }
  .next-label { font-size: 0.75rem; color: var(--gray-text); text-transform: uppercase; margin-bottom: 4px; }
  .next-title { font-weight: 700; color: #fff; font-size: 0.95rem; }
  .next-icon { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  
  /* Sidebar */
  .sidebar { width: 380px; background: var(--sidebar-bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-hdr { padding: 24px; border-bottom: 1px solid var(--border); }
  .sidebar-hdr h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
  .sidebar-hdr p { font-size: 0.8rem; color: var(--gray-text); }
  
  .lesson-list { flex: 1; overflow-y: auto; }
  
  .l-item { display: flex; gap: 16px; padding: 16px 24px; cursor: pointer; border-left: 3px solid transparent; transition: 0.2s; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .l-item:hover { background: rgba(255,255,255,0.05); }
  .l-item.active { border-left-color: var(--brand); background: rgba(0,0,0,0.4); }
  .l-item.locked { cursor: not-allowed; opacity: 0.6; }
  
  .l-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; flex-shrink: 0; }
  .l-item.active .l-icon { background: var(--brand); color: #fff; }
  
  .l-body { flex: 1; }
  .l-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; line-height: 1.4; color: var(--gray-text); }
  .l-item.active .l-title { color: var(--brand); }
  .l-item:not(.active):not(.locked) .l-title { color: #fff; }
  
  .l-sub { font-size: 0.75rem; color: var(--gray-text); display: flex; justify-content: space-between; align-items: center; }
  .badge-free-sm { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); padding: 2px 6px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; }
  
  @media(max-width: 992px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; height: 50vh; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <a href="course-detail.html" class="btn-back" id="btnBack">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="headerCourseTitle">Đang tải...</span>
  </a>
  <button class="btn-buy" id="btnBuyCourse" onclick="buyCourse()">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Mua khóa học
  </button>
</header>

<div class="layout">
  <div class="main-area">
    <div class="video-container" id="videoContainer">
      <div style="text-align:center; color:var(--gray-text);">
        <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" fill="none" style="margin-bottom:16px; opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <p>Đang tải video...</p>
      </div>
    </div>
    
    <div class="lesson-info">
      <div class="lesson-meta" id="lessonMeta">
        <div class="badge-gray" id="badgeLessonNumber">BÀI 1</div>
        <div class="badge-green" id="badgeFree" style="display:none;">Miễn phí</div>
        <div class="meta-time"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> <span id="lessonDuration">0:00</span></div>
      </div>
      
      <h1 class="lesson-title" id="lessonTitle">Đang tải...</h1>
      
      <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('desc', this)">Mô tả bài học</div>
        <div class="tab-btn" onclick="switchTab('docs', this)">Tài liệu đính kèm</div>
      </div>
      
      <div class="tab-content" id="tab-desc">Không có mô tả cho bài học này.</div>
      <div class="tab-content" id="tab-docs" style="display:none;">Không có tài liệu đính kèm.</div>
      
      <div class="next-btn" id="nextLessonBtn" style="display:none;">
        <div>
          <div class="next-label">Tiếp theo</div>
          <div class="next-title" id="nextLessonTitle">Bài tiếp theo...</div>
        </div>
        <div class="next-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="#fff" fill="none" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
    </div>
  </div>
  
  <aside class="sidebar">
    <div class="sidebar-hdr">
      <h3>Nội dung khóa học</h3>
      <p id="totalLessonsText">0 bài học</p>
    </div>
    <div class="lesson-list" id="curriculumList">
      <!-- Generated by JS -->
    </div>
  </aside>
</div>

<script>
  let isPreviewMode = false;
  let currentCourse = null;
  let flatLessons = [];
  let currentLessonId = null;

  document.addEventListener("DOMContentLoaded", () => {
    const learningCourseId = localStorage.getItem('learningCourseId');
    const adminCoursesStr = localStorage.getItem('adminCourses');
    const targetLessonId = localStorage.getItem('learningPreviewLessonId'); // optional
    
    if (!learningCourseId || !adminCoursesStr) {
      alert("Lỗi: Không tìm thấy thông tin khóa học.");
      window.location.href = "my-courses.html";
      return;
    }
    
    try {
      const adminCourses = JSON.parse(adminCoursesStr);
      currentCourse = adminCourses.find(c => c.id == learningCourseId);
      
      if (!currentCourse) {
        alert("Khóa học không tồn tại.");
        window.location.href = "my-courses.html";
        return;
      }
      
      // Check purchased status
      const purchasedStr = localStorage.getItem('purchasedCourses') || '[]';
      const purchased = JSON.parse(purchasedStr);
      const hasPurchased = purchased.some(p => p.name === currentCourse.title);
      
      isPreviewMode = !hasPurchased;
      
      if (isPreviewMode) {
        document.getElementById('btnBuyCourse').style.display = 'flex';
      }
      
      // Setup Header
      document.getElementById('headerCourseTitle').textContent = currentCourse.title;
      document.title = currentCourse.title + " - META ECOM UNI";
      
      // Flatten curriculum
      let globalIndex = 1;
      if (currentCourse.curriculum) {
        currentCourse.curriculum.forEach(sec => {
          if (sec.lessons) {
            sec.lessons.forEach(l => {
              flatLessons.push({
                ...l,
                globalIndex: globalIndex++,
                sectionTitle: sec.title
              });
            });
          }
        });
      }
      
      document.getElementById('totalLessonsText').textContent = flatLessons.length + ' bài học';
      
      if (flatLessons.length === 0) {
        document.getElementById('curriculumList').innerHTML = '<div style="padding:24px; color:var(--gray-text); text-align:center;">Chưa có bài học.</div>';
        return;
      }
      
      // Determine starting lesson
      if (targetLessonId) {
        const found = flatLessons.find(l => l.id == targetLessonId);
        if (found) currentLessonId = found.id;
      }
      
      // If no target or target is locked in preview mode, find first available
      if (!currentLessonId) {
        const firstAvailable = isPreviewMode ? flatLessons.find(l => l.isPreview) : flatLessons[0];
        if (firstAvailable) currentLessonId = firstAvailable.id;
      }
      
      if (!currentLessonId && isPreviewMode) {
        alert("Khóa học này chưa có bài học cho phép học thử.");
        window.location.href = "course-detail.html";
        return;
      }
      
      renderList();
      playLesson(currentLessonId);
      
    } catch(e) {
      console.error(e);
      alert("Đã xảy ra lỗi khi tải dữ liệu.");
    }
  });

  function renderList() {
    const listContainer = document.getElementById('curriculumList');
    let html = '';
    
    flatLessons.forEach(l => {
      const isActive = l.id === currentLessonId;
      const isLocked = isPreviewMode && !l.isPreview;
      
      let iconHtml = '';
      if (isLocked) {
        iconHtml = `<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
      } else {
        iconHtml = l.globalIndex;
      }
      
      let subHtml = '';
      if (isLocked) {
        subHtml = `<span>Cần đăng ký</span>`;
      } else if (l.isPreview && isPreviewMode) {
        subHtml = `<span>${l.duration ? l.duration + 'm' : '0m'}</span><div class="badge-free-sm">Miễn phí</div>`;
      } else {
        subHtml = `<span>${l.duration ? l.duration + 'm' : '0m'}</span>`;
      }
      
      html += `
        <div class="l-item ${isActive ? 'active' : ''} ${isLocked ? 'locked' : ''}" onclick="!${isLocked} && playLesson('${l.id}')">
          <div class="l-icon">${iconHtml}</div>
          <div class="l-body">
            <div class="l-title">BÀI ${l.globalIndex}: ${l.title}</div>
            <div class="l-sub">${subHtml}</div>
          </div>
        </div>
      `;
    });
    
    listContainer.innerHTML = html;
  }

  window.playLesson = function(id) {
    const lesson = flatLessons.find(l => l.id == id);
    if (!lesson) return;
    
    currentLessonId = lesson.id;
    renderList(); // Update active state
    
    // Update Meta
    document.getElementById('badgeLessonNumber').textContent = 'BÀI ' + lesson.globalIndex;
    document.getElementById('lessonTitle').textContent = `BÀI ${lesson.globalIndex}: ${lesson.title}`;
    document.getElementById('lessonDuration').textContent = lesson.duration ? lesson.duration + ':00' : '0:00';
    
    const badgeFree = document.getElementById('badgeFree');
    if (lesson.isPreview && isPreviewMode) {
      badgeFree.style.display = 'block';
    } else {
      badgeFree.style.display = 'none';
    }
    
    // Update Description
    document.getElementById('tab-desc').innerHTML = lesson.description ? lesson.description.replace(/\\n/g, '<br>') : 'Không có mô tả cho bài học này.';
    
    // Update Video
    const container = document.getElementById('videoContainer');
    const url = lesson.videoUrl || '';
    const type = lesson.type || 'video';
    
    if (type === 'text') {
      container.innerHTML = '<div style="height:100%; display:flex; align-items:center; justify-content:center; background:#111; color:#fff;">Đây là bài học dạng văn bản. Vui lòng đọc phần mô tả phía dưới.</div>';
    } else if (!url) {
      container.innerHTML = '<div style="height:100%; display:flex; align-items:center; justify-content:center; background:#111; color:var(--gray-text);">Video chưa được cấu hình.</div>';
    } else {
      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
      
      if (ytMatch && ytMatch[1]) {
        // YouTube Embed
        const vidId = ytMatch[1];
        container.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube-nocookie.com/embed/${vidId}?autoplay=1&rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
      } else {
        // Direct MP4 or Blob
        let finalUrl = url;
        let isMock = false;
        if (url.startsWith('blob:')) {
          finalUrl = 'https://www.w3schools.com/html/mov_bbb.mp4';
          isMock = true;
        }
        
        container.innerHTML = `
          <video src="${finalUrl}" controls autoplay style="width:100%; height:100%; object-fit:contain;"></video>
          ${isMock ? '<div style="position:absolute; top:16px; right:16px; background:rgba(239, 75, 40, 0.9); color:#fff; padding:6px 12px; border-radius:4px; font-size:0.75rem; font-weight:bold; z-index:10;">Video Demo (Local Blob File)</div>' : ''}
        `;
      }
    }
    
    // Next Lesson Logic
    const currentIndex = flatLessons.findIndex(l => l.id == lesson.id);
    const nextBtn = document.getElementById('nextLessonBtn');
    
    if (currentIndex < flatLessons.length - 1) {
      let nextLesson = flatLessons[currentIndex + 1];
      
      if (isPreviewMode && !nextLesson.isPreview) {
        // Hide next button if next is locked
        nextBtn.style.display = 'none';
      } else {
        document.getElementById('nextLessonTitle').textContent = `BÀI ${nextLesson.globalIndex}: ${nextLesson.title}`;
        nextBtn.onclick = () => playLesson(nextLesson.id);
        nextBtn.style.display = 'flex';
      }
    } else {
      nextBtn.style.display = 'none';
    }
  }

  window.switchTab = function(tab, el) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-desc').style.display = tab === 'desc' ? 'block' : 'none';
    document.getElementById('tab-docs').style.display = tab === 'docs' ? 'block' : 'none';
  }
  
  window.buyCourse = function() {
    window.location.href = 'course-detail.html';
  }
</script>
</body>
</html>
